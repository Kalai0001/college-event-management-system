<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student · EventPortal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #10233d;
            --ink-soft: #45566e;
            --slate: #64748b;
            --slate-light: #94a3b8;
            --bg: #eef2f6;
            --card: #ffffff;
            --card-2: #f6f8fb;
            --border: #e1e7ee;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --accent-soft: #dbeafe;
            --warn: #d97706;
            --warn-soft: #fdf3e0;
            --danger: #dc2626;
            --danger-soft: #fdeaea;
            --sidebar: #0b1f33;
            --sidebar-hover: rgba(255, 255, 255, .06);
            --sidebar-active: rgba(37, 99, 235, .22);
            --sidebar-text: #b9c6d6;
            --shadow: 0 1px 2px rgba(16, 35, 61, .05), 0 10px 24px rgba(16, 35, 61, .06);
            --shadow-hover: 0 6px 18px rgba(16, 35, 61, .12);
        }

        html[data-theme="dark"] {
            --ink: #e9edf3;
            --ink-soft: #b7c2d1;
            --slate: #8b98ab;
            --slate-light: #62708a;
            --bg: #0b1420;
            --card: #121d2c;
            --card-2: #0e1826;
            --border: #223247;
            --accent: #60a5fa;
            --accent-dark: #3b82f6;
            --accent-soft: rgba(96, 165, 250, .14);
            --warn: #f0a93a;
            --warn-soft: rgba(240, 169, 58, .14);
            --danger: #ff6b6b;
            --danger-soft: rgba(255, 107, 107, .14);
            --sidebar: #060d16;
            --sidebar-hover: rgba(255, 255, 255, .05);
            --sidebar-active: rgba(96, 165, 250, .18);
            --sidebar-text: #90a0b8;
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 26px rgba(0, 0, 0, .45);
            --shadow-hover: 0 8px 22px rgba(0, 0, 0, .5);
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: light;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            transition: background .25s ease, color .25s ease;
        }

        h1,
        h2,
        h3,
        .brand {
            font-family: 'Lexend', 'Inter', sans-serif;
        }

        .shell {
            display: flex;
            min-height: 100vh;
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            width: 258px;
            min-width: 258px;
            background: var(--sidebar);
            padding: 22px 16px 20px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 20;
            transition: background .25s ease;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            padding: 6px 10px 26px;
        }

        .sidebar .brand .mark {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, .35);
            flex-shrink: 0;
        }

        .nav-group-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--sidebar-text);
            opacity: .6;
            font-weight: 700;
            padding: 8px 12px 8px;
        }

        .sidebar nav {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 9px;
            text-decoration: none;
            color: var(--sidebar-text);
            font-size: 14px;
            font-weight: 500;
            position: relative;
            transition: background .16s ease, color .16s ease, padding-left .16s ease;
        }

        .sidebar nav a svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .sidebar nav a:hover {
            background: var(--sidebar-hover);
            color: #fff;
            padding-left: 16px;
        }

        .sidebar nav a.active {
            background: var(--sidebar-active);
            color: #fff;
        }

        .sidebar nav a.active::before {
            content: "";
            position: absolute;
            left: -16px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 3px;
            background: var(--accent);
        }

        .sidebar .divider {
            height: 1px;
            background: rgba(255, 255, 255, .08);
            margin: 12px 4px;
        }

        .sidebar .logout {
            color: #e8a798;
        }

        .sidebar .logout:hover {
            background: rgba(220, 38, 38, .12);
            color: #ff9a86;
        }

        /* ---------- Main ---------- */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 16px 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background .25s ease, border-color .25s ease;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--slate);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 10px;
            border-radius: 8px;
            transition: background .15s ease, color .15s ease;
        }

        .back-link:hover {
            background: var(--card-2);
            color: var(--ink);
        }

        .back-link svg {
            width: 15px;
            height: 15px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .role-badge {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--accent-dark);
            background: var(--accent-soft);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--ink-soft), var(--ink));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .page {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 34px 60px;
        }

        /* ---------- Hero ---------- */
        .edit-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--warn);
            background: var(--warn-soft);
            padding: 7px 14px;
            border-radius: 20px;
            width: fit-content;
            margin-bottom: 14px;
        }

        .edit-banner svg {
            width: 13px;
            height: 13px;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 26px 34px;
            margin-bottom: 26px;
            background: linear-gradient(120deg, var(--ink) 0%, #1c3a5e 55%, var(--accent-dark) 130%);
            box-shadow: 0 10px 28px -10px rgba(16, 35, 61, .35);
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .06);
        }

        .hero::before {
            width: 220px;
            height: 220px;
            top: -110px;
            right: -50px;
        }

        .hero::after {
            width: 140px;
            height: 140px;
            bottom: -80px;
            right: 100px;
            background: rgba(37, 99, 235, .22);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .hero-badge {
            width: 46px;
            height: 46px;
            min-width: 46px;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px -4px rgba(37, 99, 235, .55);
        }

        .hero-badge svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .hero h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.015em;
        }

        .hero p {
            margin: 6px 0 0;
            font-size: 13.5px;
            color: rgba(255, 255, 255, .72);
            max-width: 440px;
        }

        /* ---------- Form ---------- */
        .form-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 26px 26px 8px;
            transition: background .25s ease, border-color .25s ease;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 22px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .field .input-wrap {
            position: relative;
        }

        .field .input-wrap svg {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--slate-light);
            pointer-events: none;
        }

        .field input {
            width: 100%;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--ink);
            background: var(--card-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px 11px 38px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .25s ease;
        }

        .field input::placeholder {
            color: var(--slate-light);
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--card);
        }

        /* ---------- Actions ---------- */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 18px 0 22px;
            border-top: 1px solid var(--border);
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 11px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn-ghost {
            background: var(--card);
            color: var(--ink-soft);
            border-color: var(--border);
        }

        .btn-ghost:hover {
            background: var(--card-2);
            color: var(--ink);
        }

        .btn-update {
            background: linear-gradient(135deg, var(--warn), #b45309);
            color: #fff;
            box-shadow: 0 6px 16px -4px rgba(217, 119, 6, .45);
        }

        .btn-update:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -4px rgba(217, 119, 6, .55);
        }

        @media (max-width: 700px) {
            .field-grid {
                grid-template-columns: 1fr;
            }

            .page {
                padding: 22px 18px 48px;
            }

            .topbar {
                padding: 14px 18px;
            }

            .form-section {
                padding: 20px 20px 4px;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                justify-content: center;
                width: 100%;
            }
        }

        @media (max-width: 760px) {
            .shell {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: auto;
                position: relative;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                padding: 14px 16px;
            }

            .sidebar .brand {
                padding: 0 10px 0 0;
            }

            .sidebar nav {
                flex-direction: row;
                flex-wrap: wrap;
                flex: none;
                width: 100%;
                margin-top: 10px;
            }

            .nav-group-label,
            .sidebar .divider {
                display: none;
            }

            .sidebar nav a {
                padding: 8px 10px;
            }

            .sidebar nav a.active::before {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .role-badge {
                display: none;
            }
        }
    </style>

</head>

<body>

    <div class="shell">

        <aside class="sidebar">
            <div class="brand">
                <span class="mark">EH</span>
                EventPortal
            </div>

            <p class="nav-group-label">Main</p>
            <nav>
                <a href="/admin-dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 10.5 12 3l9 7.5" />
                        <path d="M5 9.5V21h14V9.5" />
                        <path d="M9 21v-6h6v6" />
                    </svg>
                    Dashboard
                </a>
                <a href="/events-page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
                        <path d="M3 9.5h18M8 3v3M16 3v3" />
                    </svg>
                    Manage Events
                </a>
                <a href="/completed-events">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="m8.5 12.3 2.4 2.4 4.6-5.4" />
                    </svg>
                    Completed Events
                </a>
                <a href="/students-page" class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="8" r="3.5" />
                        <path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" />
                    </svg>
                    Manage Students
                </a>
                <a href="/registrations-page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M7 3.5h8l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" />
                        <path d="M9 12h6M9 15.5h6M9 8.5h3" />
                    </svg>
                    Registrations
                </a>
                <a href="/admin/certificates">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="8.5" r="5.5" />
                        <path d="m8.2 13.2-1.4 7.3 5.2-2.8 5.2 2.8-1.4-7.3" />
                    </svg>
                    Certificates
                </a>
            </nav>

            <div class="divider"></div>
            <nav>
                <a href="/logout" class="logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 4.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 19.5h9" />
                        <path d="M20 12H10.5M20 12l-3.5-3.5M20 12l-3.5 3.5" />
                    </svg>
                    Logout
                </a>
            </nav>
        </aside>

        <div class="main">

            <div class="topbar">
                <div class="topbar-left">
                    <a href="/students-page" class="back-link">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 12H5M11 6l-6 6 6 6" />
                        </svg>
                        Back to Students
                    </a>
                </div>
                <div class="topbar-right">
                    <span class="role-badge">Administrator</span>
                    <div class="avatar" aria-hidden="true">AD</div>
                </div>
            </div>

            <div class="page">

                <span class="edit-banner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" />
                        <path d="m14.5 6.5 3 3" />
                    </svg>
                    Editing existing student
                </span>

                <div class="hero">
                    <div class="hero-content">
                        <span class="hero-badge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="8" r="3.5" />
                                <path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" />
                            </svg>
                        </span>
                        <div>
                            <h2 th:text="'Edit ' + ${student.name}">Edit Student</h2>
                            <p>Update the details below, then save to apply the changes.</p>
                        </div>
                    </div>
                </div>

                <form action="/update-student" method="post">

                    <input type="hidden" name="id" th:value="${student.id}">

                    <div class="form-section">
                        <div class="field-grid">

                            <div class="field full">
                                <label for="name">Full name</label>
                                <div class="input-wrap">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="8" r="3.5" />
                                        <path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5" />
                                    </svg>
                                    <input type="text" id="name" name="name" th:value="${student.name}"
                                        placeholder="Student's full name">
                                </div>
                            </div>

                            <div class="field full">
                                <label for="email">Email</label>
                                <div class="input-wrap">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="5" width="18" height="14" rx="2.5" />
                                        <path d="m4 7 8 6 8-6" />
                                    </svg>
                                    <input type="email" id="email" name="email" th:value="${student.email}"
                                        placeholder="student@email.com">
                                </div>
                            </div>

                            <div class="field">
                                <label for="department">Department</label>
                                <div class="input-wrap">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M4 21V9l8-5 8 5v12" />
                                        <path d="M9 21v-6h6v6" />
                                    </svg>
                                    <input type="text" id="department" name="department"
                                        th:value="${student.department}" placeholder="e.g. AIDS">
                                </div>
                            </div>

                            <div class="field">
                                <label for="year">Year</label>
                                <div class="input-wrap">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
                                        <path d="M3 9.5h18M8 3v3M16 3v3" />
                                    </svg>
                                    <input type="number" id="year" name="year" th:value="${student.year}"
                                        placeholder="1 - 4">
                                </div>
                            </div>

                        </div>

                        <div class="form-actions">
                            <a href="/students-page" class="btn btn-ghost">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 12H5M11 6l-6 6 6 6" />
                                </svg>
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-update">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" />
                                    <path d="m14.5 6.5 3 3" />
                                </svg>
                                Update Student
                            </button>
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script>
        // Follows the shared theme set on the dashboard — no toggle on this page.
        (function () {
            var root = document.documentElement;
            function apply(theme) { root.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light'); }

            var saved = null;
            try { saved = localStorage.getItem('eventPortalTheme'); } catch (e) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            apply(saved || (prefersDark ? 'dark' : 'light'));

            window.addEventListener('storage', function (e) {
                if (e.key === 'eventPortalTheme') apply(e.newValue);
            });
        })();
    </script>

</body>

</html>
