<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registrations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --navy: #0F172A;
            --paper: #F7F5F0;
            --paper-line: #E4E0D6;
            --accent: #0E7C66;
            --accent-soft: #E4F3EE;
            --text: #1C1D1B;
            --text-muted: #6B6F76;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            color: var(--text);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .topbar {
            background: var(--navy);
            color: #fff;
            padding: 18px 32px;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-size: 15px;
        }

        .topbar span {
            color: #8FD9C4;
        }

        .wrap {
            max-width: 880px;
            margin: 48px auto;
            padding: 0 24px 64px;
        }

        .wrap h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .wrap .sub {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0 0 28px;
        }

        .panel {
            background: #fff;
            border: 1px solid var(--paper-line);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
            padding: 14px 20px;
            background: #FAF9F6;
            border-bottom: 1px solid var(--paper-line);
        }

        tbody td {
            padding: 16px 20px;
            font-size: 14px;
            border-bottom: 1px solid var(--paper-line);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #FBFAF7;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-paid {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .badge-paid svg {
            width: 12px;
            height: 12px;
        }

        .pay-btn {
            display: inline-block;
            padding: 8px 16px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: background .15s ease;
        }

        .pay-btn:hover {
            background: #0B6553;
            color: #fff;
        }

        .empty {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            font-size: 13.5px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--text);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--navy);
            color: #fff;
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity .35s ease, transform .35s ease;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast .check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .toast .check svg {
            width: 11px;
            height: 11px;
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .toast .msg strong {
            color: #8FD9C4;
        }

        @media (prefers-reduced-motion: reduce) {
            .toast {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">Event<span>Reg</span></div>

    <div class="toast" id="paidToast">
        <span class="check">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </span>
        <span class="msg">Payment successful — your registration is <strong>confirmed</strong>.</span>
    </div>

    <div class="wrap">
        <h1>My Registrations</h1>
        <p class="sub">Track payment status and complete checkout for any pending registrations.</p>

        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>Registration ID</th>
                        <th>Event ID</th>
                        <th>Payment Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reg : ${registrations}">
                        <td class="mono" th:text="${'#' + reg.id}"></td>
                        <td th:text="${reg.eventId}"></td>
                        <td th:text="${reg.paymentStatus}"></td>
                        <td>
                            <a th:if="${reg.paymentStatus == 'PENDING'}" th:href="@{/pay/{id}(id=${reg.id})}"
                                class="pay-btn">
                                Pay now
                            </a>
                            <span th:if="${reg.paymentStatus == 'PAID'}" class="badge badge-paid">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg>
                                Paid
                            </span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(registrations)}">
                        <td colspan="4" class="empty">You have no registrations yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/dashboard" class="back-link">← Back to dashboard</a>
    </div>

    <script>
        // Show a brief confirmation toast when the user lands here right after
        // paying, e.g. redirected to /registrations?paid=true
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('paid') === 'true') {
                const toast = document.getElementById('paidToast');
                requestAnimationFrame(() => toast.classList.add('show'));

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 4000);

                // Clean the query param out of the URL so a refresh doesn't re-show it
                const url = new URL(window.location.href);
                url.searchParams.delete('paid');
                window.history.replaceState({}, '', url);
            }
        })();
    </script>

</body>

</html>
