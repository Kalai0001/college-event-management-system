        rel="stylesheet">
    <style>
        :root {
            --indigo: #2563eb;
            --indigo-strong: #1d4ed8;
            --indigo-bg: #eff6ff;
            --rose: #db2777;
            --rose-bg: #fdf2f8;
            --teal: #0d9488;
            --teal-bg: #f0fdfa;
            --green: #16a34a;
            --green-bg: #f0fdf4;
            --amber: #d97706;
            --amber-bg: #fffbeb;
            --error: #dc2626;
            --error-bg: #fef2f2;

            --bg: #eef2f9;
            --bg-grad-1: #e8f0fe;
            --bg-grad-2: #f3f7fd;
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --ink: #0f1b2d;
            --muted: #5b6b82;
            --border: #dfe6f0;
            --shadow: 0 1px 3px rgba(15, 40, 90, .06), 0 10px 28px rgba(15, 40, 90, .07);
            --shadow-hover: 0 6px 14px rgba(15, 40, 90, .09), 0 20px 40px rgba(15, 40, 90, .12);
        }

        html[data-theme="dark"] {
            --indigo: #818cf8;
            --indigo-strong: #a5b4fc;
            --indigo-bg: rgba(129, 140, 248, .14);
            --rose: #fb7185;
            --rose-bg: rgba(251, 113, 133, .14);
            --teal: #22d3ee;
            --teal-bg: rgba(34, 211, 238, .14);
            --green: #4ade80;
            --green-bg: rgba(74, 222, 128, .14);
            --amber: #fbbf24;
            --amber-bg: rgba(251, 191, 36, .14);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, .14);

            --bg: #0a0e1a;
            --bg-grad-1: #0a0e1a;
            --bg-grad-2: #0a0e1a;
            --surface: #121826;
            --surface-2: #0e1420;
            --ink: #e7eaf3;
            --muted: #8b95ac;
            --border: #212a3d;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
            --shadow-hover: 0 4px 14px rgba(0, 0, 0, .35), 0 20px 40px rgba(0, 0, 0, .4);
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: light;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg) 45%, var(--bg-grad-2) 100%);
            background-attachment: fixed;
            color: var(--ink);
            transition: background .25s ease, color .25s ease;
        }

        h1,
        h2,
        h3 {
            font-family: 'Lexend', 'Inter', sans-serif;
        }

        svg {
            display: block;
        }

        .info-icon svg,
        .meta-icon svg {
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ---------- Nav ---------- */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background .25s ease, border-color .25s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-badge {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-strong) 100%);
            color: #fff;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lexend', sans-serif;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, .28);
        }

        .brand-name {
            color: var(--ink);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -.01em;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 600;
            transition: background .15s ease, color .15s ease;
        }

        .nav-link:hover {
            background: var(--indigo-bg);
            color: var(--indigo-strong);
        }

        .nav-link-logout {
            color: var(--error);
            border: 1px solid var(--error-bg);
            margin-left: 8px;
        }

        html[data-theme="dark"] .nav-link-logout {
            border-color: rgba(248, 113, 113, .3);
        }

        .nav-link-logout:hover {
            background: var(--error-bg);
            color: var(--error);
        }

        /* ---------- Theme toggle ---------- */
        .theme-toggle {
            position: relative;
            width: 52px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            transition: background .25s ease, border-color .25s ease;
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--indigo);
            outline-offset: 2px;
        }

        .theme-toggle .track-icon {
            position: absolute;
            width: 14px;
            height: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            opacity: .7;
        }

        .theme-toggle .track-icon.sun {
            left: 6px;
        }

        .theme-toggle .track-icon.moon {
            right: 6px;
        }

        .theme-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-strong) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transform: translateX(0);
            transition: transform .28s cubic-bezier(.4, 0, .2, 1), background .25s ease;
            box-shadow: 0 2px 6px rgba(79, 70, 229, .4);
            z-index: 1;
        }

        html[data-theme="dark"] .theme-thumb {
            transform: translateX(24px);
        }

        .theme-thumb svg {
            width: 13px;
            height: 13px;
        }

        /* ---------- Page ---------- */
        .page-content {
            max-width: 780px;
            margin: 0 auto;
            padding: 36px 24px 90px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 18px;
            transition: color .15s ease;
        }

        .back-link:hover {
            color: var(--indigo-strong);
        }

        /* ---------- Hero ---------- */
        .event-hero {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            padding: 32px 28px;
            margin-bottom: 20px;
            background: linear-gradient(120deg, var(--indigo) 0%, var(--indigo-strong) 55%, #0f2f8f 100%);
            box-shadow: 0 10px 26px rgba(37, 99, 235, .25);
        }

        html[data-theme="dark"] .event-hero {
            box-shadow: 0 10px 26px rgba(0, 0, 0, .35);
        }

        .event-hero::before {
            content: "";
            position: absolute;
            top: -60px;
            right: -40px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .12);
            pointer-events: none;
        }

        .event-hero::after {
            content: "";
            position: absolute;
            bottom: -70px;
            right: 90px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            pointer-events: none;
        }

        .event-hero-badge {
            position: relative;
            display: inline-block;
            background: rgba(255, 255, 255, .18);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .event-hero h1 {
            position: relative;
            font-size: 27px;
            font-weight: 800;
            margin: 0 0 8px;
            letter-spacing: -.015em;
            color: #ffffff;
            line-height: 1.25;
        }

        .event-hero-meta {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            color: rgba(255, 255, 255, .88);
            font-size: 13.5px;
            font-weight: 600;
        }

        .event-hero-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-hero-meta svg {
            width: 15px;
            height: 15px;
            stroke: rgba(255, 255, 255, .88);
            fill: none;
            stroke-width: 2;
        }

        /* ---------- Info panel ---------- */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: background .25s ease, border-color .25s ease;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
        }

        .info-item {
            background: var(--surface);
            padding: 18px 22px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-icon-indigo {
            background: var(--indigo-bg);
            color: var(--indigo-strong);
        }

        .info-icon-rose {
            background: var(--rose-bg);
            color: var(--rose);
        }

        .info-icon-teal {
            background: var(--teal-bg);
            color: var(--teal);
        }

        .info-icon-amber {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .info-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink);
        }

        .desc-panel {
            padding: 22px;
        }

        .desc-panel h3 {
            font-size: 14px;
            font-weight: 800;
            margin: 0 0 10px;
            color: var(--ink);
        }

        .desc-panel p {
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--muted);
            margin: 0;
        }

        /* ---------- Actions ---------- */
        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background .15s ease, box-shadow .15s ease, transform .1s ease;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-solid {
            flex: 2;
            background: linear-gradient(135deg, var(--green) 0%, #0d9448 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, .3);
        }

        .btn-solid:hover {
            box-shadow: 0 6px 18px rgba(22, 163, 74, .4);
        }

        .btn-outline {
            flex: 1;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-2);
        }

        @media (max-width:640px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

            nav {
                padding: 0 20px;
            }

            .event-hero h1 {
                font-size: 22px;
            }

            .action-row {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

    <script>
        (function () {
            var root = document.documentElement;
            var toggle = document.getElementById('themeToggle');
            var thumbIcon = document.getElementById('thumbIcon');

            var sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
            var moonPath = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';

            function apply(theme) {
                root.setAttribute('data-theme', theme);
                toggle.setAttribute('aria-pressed', theme === 'dark');
                thumbIcon.innerHTML = theme === 'dark' ? moonPath : sunPath;
                try { localStorage.setItem('eventPortalTheme', theme); } catch (e) { }
            }

            var saved = null;
            try { saved = localStorage.getItem('eventPortalTheme'); } catch (e) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            apply(saved || (prefersDark ? 'dark' : 'light'));

            toggle.addEventListener('click', function () {

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details · Event Portal</title>

        rel="stylesheet">
    <style>
        :root {
            --indigo: #2563eb;
            --indigo-strong: #1d4ed8;
            --indigo-bg: #eff6ff;
            --rose: #db2777;
            --rose-bg: #fdf2f8;
            --teal: #0d9488;
            --teal-bg: #f0fdfa;
            --green: #16a34a;
            --green-bg: #f0fdf4;
            --amber: #d97706;
            --amber-bg: #fffbeb;
            --error: #dc2626;
            --error-bg: #fef2f2;

            --bg: #eef2f9;
            --bg-grad-1: #e8f0fe;
            --bg-grad-2: #f3f7fd;
            --surface: #ffffff;
            --surface-2: #f7f9fc;
            --ink: #0f1b2d;
            --muted: #5b6b82;
            --border: #dfe6f0;
            --shadow: 0 1px 3px rgba(15, 40, 90, .06), 0 10px 28px rgba(15, 40, 90, .07);
            --shadow-hover: 0 6px 14px rgba(15, 40, 90, .09), 0 20px 40px rgba(15, 40, 90, .12);
        }

        html[data-theme="dark"] {
            --indigo: #818cf8;
            --indigo-strong: #a5b4fc;
            --indigo-bg: rgba(129, 140, 248, .14);
            --rose: #fb7185;
            --rose-bg: rgba(251, 113, 133, .14);
            --teal: #22d3ee;
            --teal-bg: rgba(34, 211, 238, .14);
            --green: #4ade80;
            --green-bg: rgba(74, 222, 128, .14);
            --amber: #fbbf24;
            --amber-bg: rgba(251, 191, 36, .14);
            --error: #f87171;
            --error-bg: rgba(248, 113, 113, .14);

            --bg: #0a0e1a;
            --bg-grad-1: #0a0e1a;
            --bg-grad-2: #0a0e1a;
            --surface: #121826;
            --surface-2: #0e1420;
            --ink: #e7eaf3;
            --muted: #8b95ac;
            --border: #212a3d;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
            --shadow-hover: 0 4px 14px rgba(0, 0, 0, .35), 0 20px 40px rgba(0, 0, 0, .4);
        }

        * {
            box-sizing: border-box;
        }

        html {
            color-scheme: light;
        }

        html[data-theme="dark"] {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            color: var(--ink);

        svg {

        .nav-link-logout {
            color: var(--error);

            border-color: rgba(248, 113, 113, .3);

        .nav-link-logout:hover {
            background: var(--error-bg);

        /* ---------- Theme toggle ---------- */
        .theme-toggle {
            position: relative;

            height: 28px;

            background: var(--surface-2);

            flex-shrink: 0;

        .theme-toggle .track-icon.moon {
            right: 6px;

        /* ---------- Info panel ---------- */
        .panel {
            background: var(--surface);

            border-radius: 18px;
            overflow: hidden;

        .info-grid {

        }

        .info-item {

        .info-icon {

            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-icon-indigo {
            background: var(--indigo-bg);
            color: var(--indigo-strong);
        }

        .info-icon-rose {
            background: var(--rose-bg);
            color: var(--rose);
        }

        .info-icon-teal {
            background: var(--teal-bg);
            color: var(--teal);
        }

        .info-icon-amber {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .info-label {
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--ink);
        }

        .desc-panel {
            padding: 22px;
        }

        .desc-panel h3 {
            font-size: 14px;
            font-weight: 800;
            margin: 0 0 10px;
            color: var(--ink);
        }

        .desc-panel p {
            font-size: 14.5px;
            line-height: 1.7;
            color: var(--muted);
            margin: 0;
        }

        /* ---------- Actions ---------- */
        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 20px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background .15s ease, box-shadow .15s ease, transform .1s ease;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-solid {
            flex: 2;
            background: linear-gradient(135deg, var(--green) 0%, #0d9448 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(22, 163, 74, .3);
        }

        .btn-solid:hover {
            box-shadow: 0 6px 18px rgba(22, 163, 74, .4);
        }

        .btn-solid:disabled {
            cursor: not-allowed;
        }

        .btn-outline {
            flex: 1;
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-2);
        }

        @media (max-width:640px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

            nav {
                padding: 0 20px;
            }

            .event-hero h1 {
                font-size: 22px;
            }

            .action-row {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

                root.setAttribute('data-theme', theme);
                toggle.setAttribute('aria-pressed', theme === 'dark');
                thumbIcon.innerHTML = theme === 'dark' ? moonPath : sunPath;
                try { localStorage.setItem('eventPortalTheme', theme); } catch (e) { }
            }

            var saved = null;
            try { saved = localStorage.getItem('eventPortalTheme'); } catch (e) { }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            apply(saved || (prefersDark ? 'dark' : 'light'));

            toggle.addEventListener('click', function () {
                var current = root.getAttribute('data-theme');
                apply(current === 'dark' ? 'light' : 'dark');
            });
        })();
    </script>

</body>

</html>
