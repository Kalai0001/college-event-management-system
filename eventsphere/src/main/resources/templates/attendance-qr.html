<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance QR | EventPortal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --indigo: #4f46e5;
            --indigo-dark: #4338ca;
            --indigo-soft: #eef2ff;
            --border: #e6e9f2;
            --green: #16a34a;
            --green-soft: #ecfdf3;
            --red: #dc2626;
            --red-soft: #fef2f2;
            --glass: rgba(255, 255, 255, 0.72);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 18px;
            color: var(--ink);
            background:
                radial-gradient(600px circle at 12% 8%, #e0e7ff 0%, transparent 60%),
                radial-gradient(500px circle at 90% 15%, #dbeafe 0%, transparent 55%),
                radial-gradient(700px circle at 50% 100%, #ede9fe 0%, transparent 60%),
                #f8fafc;
        }

        /* ---------- Card ---------- */
        .card {
            width: 440px;
            max-width: 100%;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(30, 41, 59, 0.12), 0 2px 8px rgba(30, 41, 59, 0.06);
            overflow: hidden;
            opacity: 0;
            transform: translateY(18px);
            animation: cardIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Header ---------- */
        .header {
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
            color: #fff;
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand .logo {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .brand .name {
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.2px;
            line-height: 1.1;
        }

        .brand .name small {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: #c7d2fe;
            letter-spacing: 0.4px;
        }

        /* ---------- Event info ---------- */
        .info {
            padding: 22px 26px 8px;
        }

        .info-title {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
        }

        .info-item i {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--indigo-soft);
            color: var(--indigo);
            border-radius: 8px;
            font-size: 12.5px;
        }

        .info-item .label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
        }

        .info-item .value {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--ink);
            line-height: 1.3;
        }

        /* ---------- QR section ---------- */
        .qr-section {
            padding: 22px 26px 6px;
            text-align: center;
        }

        .qr-section .section-label {
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .qr-frame {
            position: relative;
            display: inline-block;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .qr-frame:hover {
            transform: scale(1.035);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.18);
        }

        .qr-frame::before,
        .qr-frame::after,
        .qr-frame .corner-tl,
        .qr-frame .corner-br {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid var(--indigo);
        }

        .qr-frame::before {
            top: 6px;
            left: 6px;
            border-right: none;
            border-bottom: none;
            border-radius: 6px 0 0 0;
        }

        .qr-frame::after {
            bottom: 6px;
            right: 6px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 6px 0;
        }

        .qr-frame .corner-tl {
            top: 6px;
            right: 6px;
            border-left: none;
            border-bottom: none;
            border-radius: 0 6px 0 0;
        }

        .qr-frame .corner-br {
            bottom: 6px;
            left: 6px;
            border-right: none;
            border-top: none;
            border-radius: 0 0 0 6px;
        }

        .qr-frame img {
            width: 190px;
            height: 190px;
            display: block;
            border-radius: 6px;
        }

        .qr-hint {
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--muted);
        }

        /* ---------- Countdown ---------- */
        .countdown-section {
            margin: 20px 26px 0;
            padding: 18px 20px;
            border-radius: 14px;
            background: linear-gradient(180deg, var(--indigo-soft) 0%, rgba(238, 242, 255, 0.3) 100%);
            border: 1px solid #e0e4fb;
            text-align: center;
        }

        .countdown-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--indigo-dark);
            text-transform: uppercase;
        }

        #countdown {
            font-family: 'Sora', sans-serif;
            font-size: 40px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            background: var(--green-soft);
            color: var(--green);
        }

        .status-pill.closed {
            background: var(--red-soft);
            color: var(--red);
        }

        /* ---------- Action ---------- */
        .action {
            text-align: center;
            padding: 20px 26px 6px;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 24px;
            background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.36);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn:focus-visible {
            outline: 2px solid var(--indigo-dark);
            outline-offset: 2px;
        }

        /* ---------- Footer ---------- */
        .footer {
            margin-top: 18px;
            padding: 16px 26px 22px;
            border-top: 1px solid var(--border);
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            padding: 4px 0;
        }

        .footer-item i {
            color: var(--indigo);
            font-size: 12px;
            width: 14px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                border-radius: 16px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .qr-frame img {
                width: 165px;
                height: 165px;
            }

            #countdown {
                font-size: 32px;
            }
        }
    </style>

</head>

<body>

    <div class="card">

        <div class="header">
            <div class="brand">
                <div class="logo"><i class="fa-solid fa-qrcode"></i></div>
                <div class="name">EventPortal<small>Attendance System</small></div>
            </div>
        </div>

        <div class="info">
            <div class="info-title" th:text="${event.name}"></div>
            <div class="info-grid">
                <div class="info-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <div class="label">Venue</div>
                        <div class="value" th:text="${event.venue}"></div>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-calendar-days"></i>
                    <div>
                        <div class="label">Date</div>
                        <div class="value" th:text="${event.date}"></div>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-clock"></i>
                    <div>
                        <div class="label">Time</div>
                        <div class="value" th:text="${event.time}"></div>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fa-solid fa-user-check"></i>
                    <div>
                        <div class="label">Mode</div>
                        <div class="value">QR Check-in</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="qr-section">
            <p class="section-label"><i class="fa-solid fa-mobile-screen-button"></i> Scan to check in</p>
            <div class="qr-frame">
                <span class="corner-tl"></span>
                <span class="corner-br"></span>
                <img th:src="@{/admin/generate-qr/{id}(id=${event.id})}" alt="Attendance QR code">
            </div>
            <p class="qr-hint">Log into EventPortal on your phone, then scan</p>
        </div>

        <div class="countdown-section">
            <p class="countdown-label"><i class="fa-solid fa-hourglass-half"></i> Attendance closes in</p>
            <div id="countdown">00:00</div>

            <div class="status-pill" id="status">
                <span id="statusText">Attendance Open</span>
            </div>
        </div>

        <div class="action">
            <button class="copy-btn" onclick="copyPageLink()">
                <i class="fa-solid fa-link"></i> Copy Link
            </button>
        </div>

        <div class="footer">
            <div class="footer-item"><i class="fa-solid fa-circle-check"></i> Attendance is marked automatically once
                scanned</div>
            <div class="footer-item"><i class="fa-solid fa-shield-halved"></i> Each code is valid only for this session
            </div>
        </div>

    </div>

    <script th:inline="javascript">

        let seconds = /*[[${remainingSeconds}]]*/ 0;

        const timer = document.getElementById("countdown");
        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");

        function updateTimer() {

            let min = Math.floor(seconds / 60);
            let sec = seconds % 60;

            timer.innerHTML =
                String(min).padStart(2, '0') +
                ":" +
                String(sec).padStart(2, '0');

            if (seconds <= 0) {

                timer.innerHTML = "00:00";
                statusText.innerHTML = "Attendance Closed";
                status.classList.add("closed");

                clearInterval(interval);
                return;

            }

            seconds--;

        }

        let interval = setInterval(updateTimer, 1000);

        updateTimer();

        function copyPageLink() {

            navigator.clipboard.writeText(window.location.href)
                .then(() => {
                    alert("Attendance QR link copied successfully!");
                })
                .catch(() => {
                    alert("Unable to copy the link.");
                });

        }

    </script>

</body>

</html>
